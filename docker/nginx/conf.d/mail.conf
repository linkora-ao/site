server {
  listen 80;
  server_name mail.linkora.ao;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name mail.linkora.ao;

  ssl_certificate /etc/letsencrypt/live/mail.linkora.ao/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mail.linkora.ao/privkey.pem;

  location / {
    proxy_pass http://poste:8025;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
