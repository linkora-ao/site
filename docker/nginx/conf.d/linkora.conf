server {
  listen 80;
  server_name linkora.ao www.linkora.ao;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name linkora.ao www.linkora.ao;

  ssl_certificate     /etc/letsencrypt/live/linkora.ao/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/linkora.ao/privkey.pem;

  # ← Declarar aqui como variáveis (resolução dinâmica via Docker DNS)
  set $backend_upstream http://backend:1337;
  set $app_upstream    http://app:3000;

  # location ~ ^/api/(validate-bi|send-mail-info) {
  #   limit_req  zone=app burst=300 delay=150;
  #   limit_conn conn_limit 50;
  #   resolver 127.0.0.11 valid=30s;
  #   proxy_pass         $app_upstream;    # ← variável
  #   proxy_http_version 1.1;
  #   proxy_set_header   Upgrade    $http_upgrade;
  #   proxy_set_header   Connection 'upgrade';
  #   proxy_set_header   Host       $host;
  #   proxy_cache_bypass $http_upgrade;
  # }

  location ~ ^/(api|admin|content-manager|content-type-builder|upload|i18n|users-permissions|email|documentation) {
    limit_req  zone=backend_admin burst=100 nodelay;
    limit_conn conn_limit 50;
    client_max_body_size 50m;
    proxy_buffer_size       512k;
    proxy_buffers           16 512k;
    proxy_busy_buffers_size 1m;
    proxy_max_temp_file_size 0;
    resolver 127.0.0.11 valid=30s;
    proxy_pass         $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection 'upgrade';
    proxy_set_header   Host       $host;
    proxy_cache_bypass $http_upgrade;
  }

  location / {
    limit_req  zone=app burst=600 delay=400;
    limit_conn conn_limit 80;
    resolver 127.0.0.11 valid=30s;
    proxy_pass         $app_upstream;  
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection 'upgrade';
    proxy_set_header   Host       $host;
    proxy_cache_bypass $http_upgrade;
  }

  location ~ /\. {
    deny all;
  }
}
